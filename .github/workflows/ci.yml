# See the exercise instructions.


name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests Python
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10"]

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installer pytest et flake8
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8

      - name: Exécuter les tests
        run: pytest tests/

      - name: Vérifier le code avec Flake8
        run: flake8 calculator/ tests/

  trivy-scan:
    name: Scan de sécurité Trivy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Scanner le code avec Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif

      - name: Envoyer les résultats vers GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

